# Lint and unit tests on every push and pull request. Pull requests also run the iOS tests.
#
# Cost: this workflow only uses GitHub-hosted runners, which are free for public repositories and
# use the free monthly minutes of a private one. The macOS job (iOS) counts 10x against those
# minutes, so it only runs when the repository is public or the repository variable
# ENABLE_MACOS_CI is "true".
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint and JVM tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5

      - name: ktlint
        run: ./gradlew ktlintCheck
      - name: JVM tests
        run: ./gradlew jvmTest

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/'
          retention-days: 7

  ios:
    name: iOS simulator tests
    if: >-
      github.event_name == 'pull_request' &&
      (!github.event.repository.private || vars.ENABLE_MACOS_CI == 'true')
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5

      - name: iOS simulator tests
        run: ./gradlew iosSimulatorArm64Test
